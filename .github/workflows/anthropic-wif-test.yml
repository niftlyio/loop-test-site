# Temporary: checks that this repository can sign in to Anthropic through the
# workload identity federation rule. Delete once it has passed.
name: anthropic-wif-test
on: issues
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Show the claims GitHub sends (no signature, nothing secret)
        run: |
          echo "$JWT" | jq -R 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson
            | {iss, aud, sub, ref, event_name, repository, repository_id, repository_owner, repository_owner_id, workflow_ref, job_workflow_ref}'
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_0143y2uRFRrGbKHEsg8bh7Ff",
            "organization_id": "2e809eb8-b19b-44e5-92cd-5abd4a54bfe0",
            "service_account_id": "svac_01M5Y97bxZ4yPb9ReAKH7U2o",
            "workspace_id": "wrkspc_01HRMNFAyxUU9TzS9iLfL74T"
          }
          JSON
